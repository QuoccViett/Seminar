name: CI Checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fetch full history for deep scan)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Bắt buộc fetch toàn bộ git history để quét toàn bộ commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./be
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      WEB_ORIGINS: http://127.0.0.1:5173
      SUPABASE_URL: https://ci.example.com
      SUPABASE_KEY: ci-placeholder-key
      WEB_PUSH_VAPID_PUBLIC_KEY: ci-placeholder-public-key
      WEB_PUSH_VAPID_PRIVATE_KEY: ci-placeholder-private-key
      WEB_PUSH_SUBJECT: mailto:ci@example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify VC03 constraints on an isolated database
        env:
          VC03_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc03_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc03_test
          DATABASE_URL="$VC03_TEST_DATABASE_URL" npx prisma migrate deploy
          npm run build
          npm run db:verify:vc03

      # Dùng database mới cho VC04 để phép kiểm hai ADMIN cuối không phụ thuộc fixture của VC03
      # Bài kiểm chạy HTTP thật với PostgreSQL CI và chỉ dùng mật khẩu giả trong môi trường thử
      - name: Verify VC04 management on an isolated database
        env:
          VC04_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc04_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc04_test
          DATABASE_URL="$VC04_TEST_DATABASE_URL" npx prisma migrate deploy
          node --import tsx --test test/integration/vc04.management.test.ts

      # Kiểm seed qua đủ trigger thật trên DB trống, rồi chạy lại để bắt lỗi reset hồ sơ đã nộp
      # Test giữ nguyên dữ liệu con/credential và xác nhận chặn nộp ngoài lịch vẫn hoạt động sau seed
      - name: Verify seed on an empty database and repeat safely
        env:
          SEED_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_seed
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci ci_seed
          DATABASE_URL="$SEED_TEST_DATABASE_URL" npx prisma migrate deploy
          node --import tsx --test test/integration/seed.integration.test.ts

      - name: Lint backend
        run: npm run lint

      # Kiểm VC13 trên database riêng, dùng HTTP và PostgreSQL thật với mọi provider ngoài tắt
      # Nâng cấp 10 → 11 không reset dữ liệu, xác nhận append-only và snapshot được giữ nguyên
      - name: Kiểm phản hồi lịch sử và audit VC13
        env:
          VC13_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc13_test
          VC13_UPGRADE_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc13_upgrade_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc13_test
          PGPASSWORD=ci createdb -h localhost -U ci vc13_upgrade_test
          DATABASE_URL="$VC13_TEST_DATABASE_URL" npx prisma migrate deploy
          node --import tsx --test test/integration/vc13.feedback-audit.test.ts test/integration/vc13.migration.test.ts

      # Kiểm HTTP/PG và object local thật trên database riêng, không gọi provider hay gửi tin ra ngoài
      # Migration deploy chỉ áp DB mới của CI, bài kiểm chặn mọi URL không mang tên vc10_test
      - name: Kiểm storage và minh chứng VC10 trên database riêng
        env:
          VC10_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc10_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc10_test
          DATABASE_URL="$VC10_TEST_DATABASE_URL" npx prisma migrate deploy
          node --import tsx --test test/integration/vc10.evidences.test.ts

      # Chạy scheduler với database mới, hai transaction cạnh tranh và provider giả không gửi mạng
      # Bài kiểm tự từ chối database khác tên để tránh ghi vào môi trường dùng chung
      - name: Kiểm scheduler VC11 trên database riêng
        env:
          VC11_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc11_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc11_test
          DATABASE_URL="$VC11_TEST_DATABASE_URL" npx prisma migrate deploy
          node --import tsx --test test/integration/vc11.scheduler.test.ts

      # Dùng database mới cho các tiến trình worker tách biệt, không gửi Email hay Web Push thật
      # Chứng minh nhận lại lease hết hạn và quét bù kỳ sau khi dừng qua toàn bộ cửa sổ
      - name: Kiểm phục hồi worker VC11 trên database riêng
        env:
          VC11_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc11_recovery_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc11_recovery_test
          DATABASE_URL="$VC11_TEST_DATABASE_URL" npx prisma migrate deploy
          node --import tsx --test test/integration/vc11.recovery.test.ts

      - name: Run backend unit tests
        run: npm run test:unit

      # Xuất và đọc lại bytes XLSX/PDF/DOCX trên Nest/PostgreSQL local riêng, không gửi provider ngoài
      # Kiểm quyền, scope, chữ ký hết hạn, rollback audit/storage và dọn tệp mồ côi với font đóng gói
      - name: Kiểm báo cáo VC15 trên database riêng
        env:
          VC15_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc15_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc15_test
          DATABASE_URL="$VC15_TEST_DATABASE_URL" npx prisma migrate deploy
          npm run build
          node --import tsx --test test/integration/vc15.exports.test.ts

      # Kiểm thẩm định và bổ sung trên PostgreSQL riêng, provider ngoài tắt để không gửi tin thật
      # Ma trận quyền, baseline, rollback và cạnh tranh dùng HTTP Nest cùng trigger thật
      - name: Kiểm VC12 trên database riêng
        env:
          VC12_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc12_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc12_test
          DATABASE_URL="$VC12_TEST_DATABASE_URL" npx prisma migrate deploy
          node --import tsx --test --test-concurrency=1 test/integration/vc12.review.test.ts test/integration/vc12.workflow.test.ts

      # Nâng cấp riêng từ SQL nền để chứng minh cột baseline không làm mất dữ liệu đang tồn tại
      # Database mới chỉ phục vụ phép nâng cấp, test từ chối chạy lại trên schema đã nâng cấp
      - name: Kiểm migration VC12 giữ dữ liệu
        env:
          VC12_UPGRADE_DATABASE_URL: postgresql://ci:ci@localhost:5432/vc12_upgrade_test
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci vc12_upgrade_test
          node --import tsx --test test/integration/vc12.migration.test.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build backend
        run: npm run build

      - name: Start and wait for backend
        run: |
          npm start > backend.log 2>&1 &
          for attempt in {1..20}; do
            printf 'Đang chờ backend (%s/20)\n' "$attempt"
            if curl --fail --silent http://127.0.0.1:3000/api/docs-json > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          cat backend.log
          exit 1

      - name: Run backend E2E tests
        run: npm run test:e2e

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
